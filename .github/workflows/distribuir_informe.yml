name: Distribuir informe

on:
  schedule:
- cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'ensayo'
        type: choice
        options:
          - ensayo
          - real
      simulacro:
        description: 'Simulacro: provocar una falla para probar la alerta'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  distribuir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Ejecutar cartero
        id: cartero
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODO_ENVIO: ${{ github.event.inputs.modo || 'real' }}
          SIMULACRO_FALLA: ${{ github.event.inputs.simulacro || 'false' }}
        run: |
          python distribuir_informe.py

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config --local user.name "observatorio-bot"
          git config --local user.email "bot@observatorio.local"
          git add logs/ reports/ || true
          if git diff --staged --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Registro de distribucion [skip ci]"
            git push
          fi

      - name: Abrir alerta si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['alerta-distribucion']
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 No se pudo hacer llegar el informe',
                body: 'El cartero fallo al intentar enviar el informe a Slack. Revisen los logs de la corrida.',
                labels: ['alerta-distribucion']
              });
            }

      - name: Cerrar alerta si se recupero
        if: success() && github.event.inputs.modo == 'real'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['alerta-distribucion']
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Recuperado: el informe se distribuyo o proceso con exito.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
